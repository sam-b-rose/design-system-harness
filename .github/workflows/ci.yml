name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "docs/**"
      - "AGENTS.md"
      - "skills/**"
      - "cli/**"
      - "checks/**"
      - "mcp/**"
      - "evals/**"
      - "scripts/**"
      - "tests/**"
      - "playground/**"
      - "ds.config.ts"
      - ".claude/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
